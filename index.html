<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout Life 3DRedesign mockups</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --text: #1c2430;
      --muted: #5b6676;
      --link: #1f5fbf;
      --border: #d9dee6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--border);
    }

    li { border-bottom: 1px solid var(--border); }

    a {
      display: block;
      padding: 1rem 0;
      color: var(--link);
      font-size: 1.125rem;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    a:focus-visible {
      outline: 3px solid var(--link);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>3D Redesign mockups</h1>
    <p>Choose a homepage prototype to open.</p>

    <ul>
      <li>
        <a href="https://bwursten.github.io/redesign-3D/sl-prototype/">3D Map redesign (version 1)</a>
      </li>
      <li>
        <a href="https://bwursten.github.io/redesign-3D/sl-prototype-v3/">3D Map redesign with POV (version 3)</a>
      </li>
      <li>
        <a href="https://bwursten.github.io/redesign-3D/sl-prototype-v4/">3D Map redesign with POV and smoother graphics (version 4)</a>
      </li>
    </ul>
  </main>
</body>
</html>
